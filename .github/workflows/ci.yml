name: Customer Churn CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Validate data
        run: |
          python src/validate_data.py

      - name: Train model
        run: |
          python src/train.py

      - name: Run model quality gate
        run: |
          python src/quality_gate.py

      - name: Build Docker image
        run: |
          docker build -t customer-churn-api .

      - name: Run Docker container
        run: |
          docker run -d \
            --name customer-churn-api \
            -p 8000:8000 \
            -e API_KEY=test-api-key \
            customer-churn-api

      - name: Test Docker API
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8000/health; then
              break
            fi
            sleep 2
          done

          curl -f http://localhost:8000/health

          echo "Testing unauthenticated /predict..."
          if curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "gender": "Female",
              "SeniorCitizen": 0,
              "Partner": "Yes",
              "Dependents": "No",
              "tenure": 12,
              "PhoneService": "Yes",
              "MultipleLines": "No",
              "InternetService": "Fiber optic",
              "OnlineSecurity": "No",
              "OnlineBackup": "Yes",
              "DeviceProtection": "No",
              "TechSupport": "No",
              "StreamingTV": "Yes",
              "StreamingMovies": "No",
              "Contract": "Month-to-month",
              "PaperlessBilling": "Yes",
              "PaymentMethod": "Electronic check",
              "MonthlyCharges": 70.5,
              "TotalCharges": 846.0
            }' | grep -q "^401$"; then
            echo "Unauthenticated request correctly returned 401"
          else
            echo "Unauthenticated request did not return 401"
            exit 1
          fi

          echo "Testing authenticated /predict..."
          curl -f \
            -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -H "X-API-Key: test-api-key" \
            -d '{
              "gender": "Female",
              "SeniorCitizen": 0,
              "Partner": "Yes",
              "Dependents": "No",
              "tenure": 12,
              "PhoneService": "Yes",
              "MultipleLines": "No",
              "InternetService": "Fiber optic",
              "OnlineSecurity": "No",
              "OnlineBackup": "Yes",
              "DeviceProtection": "No",
              "TechSupport": "No",
              "StreamingTV": "Yes",
              "StreamingMovies": "No",
              "Contract": "Month-to-month",
              "PaperlessBilling": "Yes",
              "PaymentMethod": "Electronic check",
              "MonthlyCharges": 70.5,
              "TotalCharges": 846.0
            }'

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: captainlevi441/customer-churn-api:latest

      - name: Stop Docker container
        if: always()
        run: |
          docker stop customer-churn-api || true
          docker rm customer-churn-api || true
